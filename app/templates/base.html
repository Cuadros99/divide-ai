<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DivideAI">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16a34a">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <title>{% block title %}DivideAI{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <main class="app-content">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block nav %}
  {% import "_icons.html" as icons %}
  <nav class="bottom-nav">
    <a href="/" class="bottom-nav__item {{ 'is-active' if active_tab == 'listas' else '' }}">
      {{ icons.icon('file-text', 18) }}
      <span>Listas</span>
    </a>
    <a href="/pessoas" class="bottom-nav__item {{ 'is-active' if active_tab == 'config' else '' }}">
      {{ icons.icon('settings', 18) }}
      <span>Configurações</span>
    </a>
  </nav>
  {% endblock %}
</body>
</html>
